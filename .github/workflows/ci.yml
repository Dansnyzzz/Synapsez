name: CI

# The tenancy suite is the one that matters: it runs the real SQL against a real
# Postgres and then tries to cross the boundary between two accounts. Running it
# on every push is the point of having written it.
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      # A ratchet, not a wall: the pre-existing errors are frozen per file and
      # this fails only when the count goes up. The count is in
      # .typecheck-baseline.json and only ever comes down; see scripts/typecheck.js.
      - name: Type-check
        run: npm run typecheck

      # Whether the assistant is still *able* to choose well: that the right
      # tool is on offer for the question, that the rule telling it to stop at a
      # sign-in page is still in the prompt, that uploading a private key still
      # asks first. Free and deterministic — the version that measures what a
      # model actually does with all that costs money and runs nightly.
      - name: Agent eval
        run: npm run eval

      # Tenancy, agent loop, HTTP layer, devices and pairing, and the deployment
      # paths under VERCEL=1. The last is the reason this job blocks a merge:
      # those branches only ever execute in production otherwise.
      - name: Test suites
        run: npm test

      # The guards in .claude/hooks are the only rules in this repo that a model
      # cannot argue with, and they sit outside `npm test` because they are not
      # application code. That is exactly how the sandbox suite came to be broken
      # without anyone noticing, so this runs here too — a guard whose test does
      # not block a merge is a guard that will eventually fail open unobserved.
      - name: Hook guards
        run: npm run test:hooks

      # The interface suite drives the real app in a real browser. It skips
      # itself when there is nothing to drive, so it is installed explicitly
      # here rather than left to chance.
      #
      # With the lockfile's own playwright-core, into the same place the test
      # steps look (PLAYWRIGHT_BROWSERS_PATH=0). `npx playwright install` fetched
      # an unpinned `playwright` — the lockfile has only playwright-core — and
      # installed into ~/.cache, where the tests, pointed at node_modules, never
      # looked; they ran only because the runner image happens to carry Chrome
      # (CFG-027). The suites now fail under CI rather than skip when no
      # browser launches, so that luck cannot turn into a silent green.
      - name: Install Chromium
        run: npx playwright-core install --with-deps chromium
        env:
          PLAYWRIGHT_BROWSERS_PATH: '0'

      - name: Interface suite
        run: npm run test:ui
        env:
          # test:ui prefers a channel build; this points it at the one just
          # installed so CI does not depend on Chrome being present.
          PLAYWRIGHT_BROWSERS_PATH: '0'

      # The browser-sandbox suite drives the same tools the assistant uses. It
      # lived outside `npm test` because it needs a browser, and outside CI it
      # broke without anyone noticing. Same Chromium as the step above.
      - name: Sandbox suite
        run: npm run test:sandbox
        env:
          PLAYWRIGHT_BROWSERS_PATH: '0'

      # The only coverage of edit_image, download_file's refusals and
      # run_background's dead-on-start detection, and it ran nowhere (CODE-040).
      # It needs the internet and a browser, which the runner has. Advisory
      # while it proves itself stable here: a red step is reported, not blocking.
      - name: Capabilities suite
        run: npm run test:capabilities
        continue-on-error: true
        env:
          PLAYWRIGHT_BROWSERS_PATH: '0'

  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Advisory, not blocking: a transitive advisory with no patch available
      # should show up in the log, not stop everyone from merging.
      - run: npm audit --audit-level=high
        continue-on-error: true
